<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            touch-action: none; /* Disables web pull-to-refresh and pinch-zoom */
        }

        #canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            outline: none;
        }

        .repo-link {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #fff;
            z-index: 10;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <p class="repo-link">
        <a href="https://github.com/ivan-enzhaev/cglm-multi-object-texture-webgpu-sdl3-c" target="_blank" rel="noopener noreferrer" style="color: white;">GitHub repository</a>
    </p>

    <script>
        console.log("HTML loaded");
        console.log("navigator.gpu =", navigator.gpu);

        var Module = {
            print: function(text) {
                console.log("[C stdout]", text);
            },

            printErr: function(text) {
                console.error("[C stderr]", text);
            },

            onRuntimeInitialized: function() {
                console.log("========== WASM RUNTIME INITIALIZED ==========");
            },

            onAbort: function(reason) {
                console.error("========== WASM ABORT ==========");
                console.error(reason);
            }
        };
    </script>

    <script src="./js/app.js"></script>

    <script>
        console.log("app.js script tag completed");
    </script>
</body>
</html>
